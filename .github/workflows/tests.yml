name: quality

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - name: Install Qt runtime dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 xvfb
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Compile check
        run: python -m compileall -q ordpaint main.py
      - name: Ruff check
        run: ruff check .
      - name: Ruff format
        shell: bash
        run: >-
          ruff format --check
          main.py ordpaint/core ordpaint/ui/layer_list.py ordpaint/ui/new_document_dialog.py
          ordpaint/ui/settings_store.py ordpaint/ui/polish.py ordpaint/ui/grid_settings_dialog.py
          ordpaint/ui/resize_integration.py tests benchmarks
      - name: Tests on Linux
        if: runner.os == 'Linux'
        env:
          QT_QPA_PLATFORM: xcb
        shell: bash
        run: |
          set -euo pipefail
          for test_file in tests/test_*.py; do
            echo "==> $test_file"
            xvfb-run -a python -m pytest -q "$test_file"
          done
      - name: Tests on Windows
        if: runner.os == 'Windows'
        run: python -m pytest -q
