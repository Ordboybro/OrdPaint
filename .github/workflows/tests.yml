name: quality

on:
  push:
  pull_request:

permissions:
  contents: write

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Qt runtime dependencies
        run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Compile check
        run: python -m compileall -q ordpaint main.py
      - name: Ruff check
        run: ruff check .
      - name: Ruff format
        run: ruff format .
      - name: Commit formatting on main
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        run: |
          if git diff --quiet; then
            echo "Formatting is already clean."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "style: apply Ruff formatting"
          git push
      - name: Tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: pytest -q
