name: release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r requirements.txt pyinstaller
      - name: Build application
        run: pyinstaller --noconfirm --clean --windowed --name OrdPaint main.py
      - name: Archive application
        shell: pwsh
        run: Compress-Archive -Path dist/OrdPaint/* -DestinationPath OrdPaint-Windows.zip
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: OrdPaint-Windows
          path: OrdPaint-Windows.zip
      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          files: OrdPaint-Windows.zip
          generate_release_notes: true
