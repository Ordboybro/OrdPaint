name: release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Compile check
        run: python -m compileall -q ordpaint main.py
      - name: Run tests
        run: python -m pytest -q
      - name: Build application
        run: python -m PyInstaller --noconfirm --clean --windowed --name OrdPaint main.py
      - name: Verify executable
        shell: pwsh
        run: |
          $exe = "dist/OrdPaint/OrdPaint.exe"
          if (-not (Test-Path $exe)) { throw "OrdPaint.exe was not produced" }
          Get-Item $exe | Select-Object FullName, Length
      - name: Smoke launch packaged application
        shell: pwsh
        run: |
          $exe = (Resolve-Path "dist/OrdPaint/OrdPaint.exe").Path
          $process = Start-Process -FilePath $exe -PassThru
          Start-Sleep -Seconds 5
          if ($process.HasExited) {
            throw "OrdPaint exited during packaged startup with code $($process.ExitCode)"
          }
          Stop-Process -Id $process.Id -Force
      - name: Archive application
        shell: pwsh
        run: Compress-Archive -Path dist/OrdPaint/* -DestinationPath OrdPaint-Windows.zip
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: OrdPaint-Windows
          path: OrdPaint-Windows.zip
      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          files: OrdPaint-Windows.zip
          generate_release_notes: true
