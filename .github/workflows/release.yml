name: release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Compile check
        run: python -m compileall -q ordpaint main.py
      - name: Run tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest -q
      - name: Build application
        run: python -m PyInstaller --noconfirm --clean --windowed --name OrdPaint main.py
      - name: Verify executable
        shell: pwsh
        run: |
          $exe = "dist/OrdPaint/OrdPaint.exe"
          if (-not (Test-Path $exe)) { throw "OrdPaint.exe was not produced" }
          Get-Item $exe | Select-Object FullName, Length
      - name: Archive application
        shell: pwsh
        run: Compress-Archive -Path dist/OrdPaint/* -DestinationPath OrdPaint-Windows.zip
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: OrdPaint-Windows
          path: OrdPaint-Windows.zip
      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: OrdPaint-Windows.zip
          generate_release_notes: true
