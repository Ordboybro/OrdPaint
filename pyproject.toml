[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "ordpaint"
version = "0.1.0"
description = "Desktop raster graphics editor built with Python and PySide6"
requires-python = ">=3.12"
readme = "README.md"
license = { file = "LICENSE" }
dependencies = ["PySide6>=6.7,<7"]

[tool.setuptools.packages.find]
include = ["ordpaint*"]

[tool.ruff]
line-length = 180
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["E501", "E701", "E702", "I001", "UP035", "UP037", "SIM105"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"
exclude = [
    "ordpaint/core/document.py",
    "ordpaint/core/raster.py",
    "ordpaint/ui/application_window.py",
    "ordpaint/ui/canvas.py",
    "ordpaint/ui/main_window.py",
    "ordpaint/ui/resize_dialog.py",
    "tests/test_transform.py",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"
